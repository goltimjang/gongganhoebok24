# 고객 후기 저장소(Supabase 무료 플랜) 일시정지 방지
#
# Supabase 무료 플랜은 일주일 동안 요청이 거의 없으면 프로젝트를 일시정지합니다.
# 하루 몇 번의 요청만 있어도 정지되지 않으므로, 매일 두 번 후기 목록을 한 번씩 조회합니다.
# 조회에 실패하면 이 작업이 실패로 표시되고 GitHub이 저장소 주인에게 메일로 알립니다.

name: 후기 저장소 유지

on:
  schedule:
    - cron: "17 0,12 * * *"   # 매일 오전 9시 17분, 오후 9시 17분 (한국 시간)
  workflow_dispatch:           # 필요할 때 수동 실행

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 후기 저장소 조회
        env:
          SB_URL: https://ibncnjdyvxhidfiehvhv.supabase.co
          # 홈페이지 코드에 이미 공개되어 있는 조회용 키입니다 (비밀 키 아님)
          SB_KEY: sb_publishable_1eqewSuXRX_400qhTqWksQ_1-cyVXoT
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
              "$SB_URL/rest/v1/reviews?select=id&limit=1" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" --max-time 30 || true)
            echo "시도 $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "정상 응답"
              exit 0
            fi
            sleep 30
          done
          echo "::error::후기 저장소가 응답하지 않습니다. Supabase 대시보드에서 일시정지 여부를 확인하고 Resume project를 눌러주세요."
          exit 1

      - name: 예약 작업 자동 중지 방지
        # 공개 저장소의 예약 작업은 60일간 저장소 활동이 없으면 GitHub이 자동으로 끕니다.
        # 매번 이 작업을 다시 '활성화' 처리해 그 기간이 지나지 않도록 합니다.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-reviews-alive.yml/enable"
